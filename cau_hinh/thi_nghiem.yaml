# Danh sách lượt huấn luyện; scripts/huan_luyen.py chạy một lượt theo tên (khóa ten).
# so_mau_epoch: số mẫu rút cân bằng mỗi epoch (20.000 để một lượt vừa ngân sách GPU). Siêu tham số chốt trên val Gianh,
# các lượt LOBO giữ nguyên siêu tham số. Lượt bỏ thành phần: "cn" bỏ riêng kênh CN, giữ đất thô; "dat_tho" bỏ đất thô, giữ CN.
# Lượt chính, bỏ thành phần, B3, B4, B5 chạy 3 seed (0, 1, 2); LOBO chạy seed 0.
# prithvi_b4: ckpt_lung + tich_luy 2 (micro-batch 8, batch hiệu dụng 16) vì trạng thái AdamW của lưng 300M tham số
# làm batch 16 tràn GPU 8 GB; lr và số mẫu giữ nguyên.
